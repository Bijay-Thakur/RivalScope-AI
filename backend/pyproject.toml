[project]
name = "rivalscope-backend"
version = "0.1.0"
description = "RivalScope AI research agent API — FastAPI + LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "python-dotenv>=1.0",
  "langgraph>=0.2.0",
  "langchain>=0.3.0",
  "langchain-google-genai>=2.0.0",
  "langchain-tavily>=0.2.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "trafilatura>=1.12.0",
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
